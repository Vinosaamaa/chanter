services:
  clamav:
    extends:
      file: media-security/compose.yml
      service: clamav
    profiles: [product]
    volumes:
      - ${CHANTER_CLAMAV_SOCKET_DIR:-../.product/clamav}:/run/clamav

  mailpit:
    image: axllent/mailpit:v1.31.1
    profiles: [product]
    container_name: chanter-mailpit
    environment:
      MP_MAX_MESSAGES: 100
      MP_DISABLE_VERSION_CHECK: "true"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16.14-alpine
    container_name: chanter-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chanter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chanter}
      POSTGRES_DB: ${POSTGRES_DB:-chanter}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chanter} -d ${POSTGRES_DB:-chanter}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.9-alpine
    container_name: chanter-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --bind 0.0.0.0
      --protected-mode no
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: chanter-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  realtime-service:
    profiles: [product]
    build:
      context: ..
      dockerfile: infra/docker/realtime-service/Dockerfile
    container_name: chanter-realtime-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      REALTIME_PORT: 8087
      CHANTER_JWT_SECRET: ${CHANTER_JWT_SECRET}
      COMMUNITY_SERVICE_URL: ${COMMUNITY_SERVICE_URL:-http://host.docker.internal:8082}
      MESSAGE_SERVICE_URL: ${MESSAGE_SERVICE_URL:-http://host.docker.internal:8083}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REALTIME_PORT:-8087}:8087"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10

  livekit:
    image: livekit/livekit-server:v1.13.1
    container_name: chanter-livekit
    profiles: [product]
    environment:
      # LiveKit reads LIVEKIT_KEYS as YAML: "apikey: apisecret"
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    command: --bind 0.0.0.0
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"

volumes:
  clamav-signatures:
  postgres-data:
  minio-data:
