rule_files: [alerts.yml]
evaluation_interval: 1m
tests:
  - name: high traffic gateway failures fire while low volume does not
    interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{service_name="gateway-service",deployment_environment_name="production",http_response_status_code="200"}'
        values: '0+90x10'
      - series: 'http_server_request_duration_seconds_count{service_name="gateway-service",deployment_environment_name="production",http_response_status_code="500"}'
        values: '0+10x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: ChanterGatewayErrors
        exp_alerts: []
      - eval_time: 8m
        alertname: ChanterGatewayErrors
        exp_alerts:
          - exp_labels: {severity: critical, owner: launch-operator, environment: production}
            exp_annotations:
              summary: Gateway failures exceed five percent with at least twenty requests per five minutes
              runbook_url: https://github.com/Vinosaamaa/chanter/blob/main/docs/operations/monitoring-runbook.md#gateway-and-capacity
  - name: one failed request must not produce a traffic percentage page
    interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{service_name="gateway-service",deployment_environment_name="production",http_response_status_code="500"}'
        values: '0 1+0x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: ChanterGatewayErrors
        exp_alerts: []
  - name: all ten service identities keep missing telemetry resolved
    interval: 1m
    input_series:
      - {series: 'jvm_memory_used_bytes{service_name="gateway-service",deployment_environment_name="production"}', values: '100+0x10'}
      - {series: 'jvm_memory_used_bytes{service_name="auth-service",deployment_environment_name="production"}', values: '100+0x10'}
      - {series: 'jvm_memory_used_bytes{service_name="community-service",deployment_environment_name="production"}', values: '100+0x10'}
      - {series: 'jvm_memory_used_bytes{service_name="message-service",deployment_environment_name="production"}', values: '100+0x10'}
      - {series: 'jvm_memory_used_bytes{service_name="realtime-service",deployment_environment_name="production"}', values: '100+0x10'}
      - {series: 'jvm_memory_used_bytes{service_name="media-service",deployment_environment_name="production"}', values: '100+0x10'}
      - {series: 'jvm_memory_used_bytes{service_name="agent-service",deployment_environment_name="production"}', values: '100+0x10'}
      - {series: 'jvm_memory_used_bytes{service_name="analytics-service",deployment_environment_name="production"}', values: '100+0x10'}
      - {series: 'jvm_memory_used_bytes{service_name="search-service",deployment_environment_name="production"}', values: '100+0x10'}
      - {series: 'jvm_memory_used_bytes{service_name="notification-service",deployment_environment_name="production"}', values: '100+0x10'}
    alert_rule_test:
      - eval_time: 8m
        alertname: ChanterTelemetryMissing
        exp_alerts: []
  - name: absent telemetry is actionable without application traffic
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 1m
        alertname: ChanterTelemetryMissing
        exp_alerts: []
      - eval_time: 3m
        alertname: ChanterTelemetryMissing
        exp_alerts:
          - exp_labels: {severity: critical, owner: launch-operator, environment: production, deployment_environment_name: production}
            exp_annotations:
              summary: One or more of the ten application services has stopped reporting
              runbook_url: https://github.com/Vinosaamaa/chanter/blob/main/docs/operations/monitoring-runbook.md#missing-telemetry
  - name: stalled email fires and resolves with a healthy source
    interval: 1m
    input_series:
      - series: 'chanter_email_oldest_age_seconds{service_name="auth-service",deployment_environment_name="production"}'
        values: '180+0x5 0+0x5'
      - series: 'chanter_email_collection_healthy_ratio{service_name="auth-service",deployment_environment_name="production"}'
        values: '1+0x11'
    alert_rule_test:
      - eval_time: 2m
        alertname: ChanterEmailStalled
        exp_alerts: []
      - eval_time: 4m
        alertname: ChanterEmailStalled
        exp_alerts:
          - exp_labels: {severity: critical, owner: launch-operator, service_name: auth-service, deployment_environment_name: production}
            exp_annotations:
              summary: Transactional email has waited over two minutes for three minutes
              runbook_url: https://github.com/Vinosaamaa/chanter/blob/main/docs/operations/monitoring-runbook.md#queues-and-email
      - eval_time: 7m
        alertname: ChanterEmailStalled
        exp_alerts: []
  - name: failed collection cannot masquerade as stalled live state
    interval: 1m
    input_series:
      - series: 'chanter_email_oldest_age_seconds{service_name="auth-service",deployment_environment_name="production"}'
        values: '180+0x8'
      - series: 'chanter_email_collection_healthy_ratio{service_name="auth-service",deployment_environment_name="production"}'
        values: '0+0x8'
    alert_rule_test:
      - eval_time: 5m
        alertname: ChanterEmailStalled
        exp_alerts: []
      - eval_time: 5m
        alertname: ChanterQueueCollectionFailed
        exp_alerts:
          - exp_labels: {severity: warning, owner: launch-operator, service_name: auth-service, deployment_environment_name: production}
            exp_annotations:
              summary: A source queue measurement is failing or stale
              runbook_url: https://github.com/Vinosaamaa/chanter/blob/main/docs/operations/monitoring-runbook.md#queues-and-email
  - name: staging never pages production
    interval: 1m
    input_series:
      - series: 'chanter_email_oldest_age_seconds{service_name="auth-service",deployment_environment_name="staging"}'
        values: '999+0x10'
      - series: 'chanter_email_collection_healthy_ratio{service_name="auth-service",deployment_environment_name="staging"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 9m
        alertname: ChanterEmailStalled
        exp_alerts: []
