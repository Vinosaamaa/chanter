server:
  port: ${AGENT_PORT:8085}

spring:
  http:
    codecs:
      preferred-json-mapper: jackson2
    converters:
      preferred-json-mapper: jackson2
  application:
    name: agent-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/chanter_agent
    username: ${POSTGRES_USER:chanter}
    password: ${POSTGRES_PASSWORD:chanter}
  flyway:
    enabled: true
    locations: classpath:db/migration

chanter:
  jwt:
    secret: ${CHANTER_JWT_SECRET}
    access-token-ttl: ${CHANTER_JWT_ACCESS_TTL:15m}
  internal-service-token: ${CHANTER_INTERNAL_SERVICE_TOKEN}
  auth-service:
    base-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  native-companion:
    origin: ${CHANTER_NATIVE_COMPANION_ORIGIN:}
    private-key-pkcs8: ${CHANTER_NATIVE_COMPANION_PRIVATE_KEY_PKCS8:}
    public-key-spki: ${CHANTER_NATIVE_COMPANION_PUBLIC_KEY_SPKI:}
    models: ${CHANTER_NATIVE_COMPANION_MODELS:}
  grounding:
    engine: ${CHANTER_GROUNDING_ENGINE:rag}
    min-retrieval-score: ${CHANTER_GROUNDING_MIN_SCORE:0.35}
    retrieval-top-k: ${CHANTER_GROUNDING_TOP_K:5}
  llm:
    enabled: ${CHANTER_LLM_ENABLED:false}
    default-model-id: ${CHANTER_LLM_DEFAULT_MODEL_ID:source-only}
    daily-token-limit: ${CHANTER_LLM_DAILY_TOKEN_LIMIT:100000}
    # Explicit model definitions belong in deployment configuration; no hosted provider or model is enabled by default.
  embeddings:
    provider: ${CHANTER_EMBEDDINGS_PROVIDER:onnx}
    model-directory: ${CHANTER_EMBEDDINGS_MODEL_DIRECTORY:.cache/models/minilm}
    default-model: ${CHANTER_EMBEDDINGS_DEFAULT_MODEL:}
    dimensions: ${CHANTER_EMBEDDINGS_DIMENSIONS:384}
  community-service:
    base-url: ${COMMUNITY_SERVICE_URL:http://localhost:8082}
    connect-timeout-seconds: 5
    read-timeout-seconds: 10
  media-service:
    base-url: ${MEDIA_SERVICE_URL:http://localhost:8084}
    connect-timeout-seconds: 5
    read-timeout-seconds: 10
  message-service:
    base-url: ${MESSAGE_SERVICE_URL:http://localhost:8083}
    connect-timeout-seconds: 5
    read-timeout-seconds: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
