name: Native companion boundary

on:
  workflow_dispatch:
  pull_request:
    paths: ['companion/**', 'backend/**', 'frontend/**', '.github/workflows/native-companion.yml']
  push:
    branches: [main]
    paths: ['companion/**', 'backend/**', 'frontend/**', '.github/workflows/native-companion.yml']

permissions:
  contents: read

jobs:
  boundary:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify native request and protected state boundaries
        run: node --test companion/tests/*.test.mjs
      # Native Codex tests skip without an explicitly supplied supported binary.
      # Hosted boundary tests do not establish provider entitlement or native isolation.

  package:
    needs: boundary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Package the exact tested source without provider binaries or credentials
        run: |
          mkdir native-package
          git archive --format=zip --output=native-package/chanter-native-source.zip HEAD companion
          git rev-parse HEAD > native-package/SOURCE_COMMIT.txt
          cd native-package
          sha256sum chanter-native-source.zip > SHA256SUMS
      - name: Attest explicitly dispatched or accepted-main source
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: native-package/chanter-native-source.zip
          create-storage-record: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-companion-source-${{ github.sha }}
          path: native-package/
          retention-days: 14
          if-no-files-found: error
