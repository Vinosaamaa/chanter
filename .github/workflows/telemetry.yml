name: Telemetry privacy
on:
  pull_request:
    paths:
      - 'backend/telemetry/**'
      - 'backend/pom.xml'
      - 'backend/common/pom.xml'
      - 'backend/common/src/**/telemetry/**'
      - 'infra/production/java/**'
      - 'infra/production/runtime-lock.json'
      - 'scripts/deploy/telemetry*'
      - 'scripts/deploy/host*'
      - 'scripts/deploy/release*'
      - 'scripts/deploy/build-release.sh'
      - 'scripts/deploy/smoke-release.sh'
      - '.github/workflows/telemetry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-agent-export:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify the pinned agent artifact
        run: |
          mkdir -p .cache/telemetry
          curl --fail --location --retry 3 https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v2.31.1/opentelemetry-javaagent.jar -o .cache/telemetry/agent.jar
          echo 'bbf83c151b6400709e2f225bdd07a04f839d9d13b8b93464241333fd25d3e3ba  .cache/telemetry/agent.jar' | sha256sum --check -
      - name: Build privacy extension and verify actual OTLP export and receiver outage
        working-directory: backend
        run: |
          mvn -B -q -pl telemetry,common -am -DskipTests package
          mvn -B -q -pl telemetry,common -am -Dtest=SafeSpanExporterTest,SafeMetricExporterTest,SafeLogFormatterTest,NativeTelemetryExportTest -Dsurefire.failIfNoSpecifiedTests=false -Dchanter.telemetry.agent="$GITHUB_WORKSPACE/.cache/telemetry/agent.jar" test
