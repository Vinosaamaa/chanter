name: Telemetry privacy
on:
  pull_request:
    paths:
      - 'backend/telemetry/**'
      - 'backend/pom.xml'
      - 'backend/common/pom.xml'
      - 'backend/common/src/**/telemetry/**'
      - 'backend/common/src/main/resources/META-INF/spring/**'
      - 'backend/common/src/**/events/OutboxMetrics*'
      - 'backend/common/src/**/events/OutboxConfiguration.java'
      - 'backend/auth-service/src/**/EmailQueueMetrics*'
      - 'backend/media-service/src/**/ResourceQueueMetrics*'
      - 'backend/agent-service/src/**/AiOperationalMetrics*'
      - 'backend/agent-service/src/**/AiGenerationLedger*'
      - 'backend/realtime-service/src/**/RealtimeMetrics*'
      - 'backend/realtime-service/src/**/RealtimeConnectionMetrics*'
      - 'backend/realtime-service/src/**/SocialRealtimeHub*'
      - 'infra/production/java/**'
      - 'infra/production/runtime-lock.json'
      - 'scripts/deploy/telemetry*'
      - 'scripts/deploy/errors*'
      - 'scripts/deploy/host*'
      - 'scripts/deploy/release*'
      - 'scripts/deploy/build-release.sh'
      - 'scripts/deploy/smoke-release.sh'
      - 'scripts/check-monitoring.mjs'
      - 'infra/monitoring/**'
      - '.github/workflows/telemetry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operational-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate actual dashboard expressions and alert transitions
        run: |
          mkdir -p .cache/monitoring
          curl --fail --location --retry 3 https://github.com/prometheus/prometheus/releases/download/v3.14.0/prometheus-3.14.0.linux-amd64.tar.gz -o .cache/monitoring/prometheus.tar.gz
          echo 'f665c6da19eb7ba399c915d30c7d9793c9b417bf8a749b504bc470678631478d  .cache/monitoring/prometheus.tar.gz' | sha256sum --check -
          tar -xzf .cache/monitoring/prometheus.tar.gz -C .cache/monitoring
          node scripts/check-monitoring.mjs .cache/monitoring/prometheus-3.14.0.linux-amd64/promtool
  native-agent-export:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    services:
      metrics-postgres:
        image: postgres:16.15-alpine3.23@sha256:3dc6d8874cacc4a9c5c1d7f63cfe5b385a22f8f3527c4896f94f9ec897dd01f2
        env:
          POSTGRES_USER: metric_test
          POSTGRES_PASSWORD: metric_test
          POSTGRES_DB: metric_test
        ports: ['5432/tcp']
        options: --health-cmd "pg_isready -U metric_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify the pinned agent artifact
        run: |
          mkdir -p .cache/telemetry
          curl --fail --location --retry 3 https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v2.31.1/opentelemetry-javaagent.jar -o .cache/telemetry/agent.jar
          echo 'bbf83c151b6400709e2f225bdd07a04f839d9d13b8b93464241333fd25d3e3ba  .cache/telemetry/agent.jar' | sha256sum --check -
      - name: Build privacy extension and verify actual OTLP export and receiver outage
        working-directory: backend
        env:
          METRIC_TEST_PORT: ${{ job.services.metrics-postgres.ports['5432'] }}
        run: |
          mvn -B -q -pl telemetry,common,auth-service,media-service,agent-service,realtime-service -am -DskipTests package
          mvn -B -q -pl telemetry,common,auth-service,media-service,agent-service,realtime-service -am -Dtest=SafeSpanExporterTest,SafeMetricExporterTest,SafeLogFormatterTest,NativeTelemetryExportTest,QueueMetricsTest,QueueMetricQueryTest,OutboxMetricsTest,NativeQueueMetricQueryTest,EmailQueueMetricsTest,ResourceQueueMetricsTest,PrivateErrorEventTest,PrivateErrorReporterTest,AiOperationalMetricsTest,AiGenerationLedgerTest,RealtimeConnectionMetricsTest -Dsurefire.failIfNoSpecifiedTests=false -Dchanter.telemetry.agent="$GITHUB_WORKSPACE/.cache/telemetry/agent.jar" -Dchanter.telemetry.jdbc="jdbc:postgresql://127.0.0.1:$METRIC_TEST_PORT/metric_test" test
