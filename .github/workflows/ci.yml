name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

# Least-privilege GITHUB_TOKEN (SEC-13 / #193).
# Jobs only need to read repository contents (checkout, build, test).
permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request' && github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  backend:
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify backend with hermetic Java 21 gate
        run: make backend-verify
      - name: Product stack script tests
        run: make product-test
      - name: Validate product Docker Compose profile
        run: docker compose -f infra/docker-compose.yml --profile product config --quiet
      - name: Retain backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/**/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

  frontend:
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - name: Audit complete dependency graph
        run: npm audit --audit-level=high
        working-directory: frontend
      - name: Lint frontend
        run: npm run lint
        working-directory: frontend
      - name: Test frontend
        run: npm test
        working-directory: frontend
      - name: Test release tooling
        run: npm run test:release
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: No-dead-controls gate
        run: node scripts/check-no-dead-controls.mjs
      - name: Playwright critical subset
        run: npm run test:e2e:critical
        working-directory: frontend
        env:
          CI: 'true'
      - name: Retain public browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-browser-test-artifacts
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 14

  product-e2e:
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deterministic frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Ensure product-stack process tooling
        run: command -v lsof >/dev/null || sudo apt-get install --yes lsof
      - name: Generate isolated product-test environment
        run: make product-env
      - name: Run signed-in Owner, Member, and Learner journeys
        run: make product-e2e
        env:
          CI: 'true'
      - name: Retain signed-in browser and service artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-in-product-test-artifacts
          path: |
            frontend/playwright-report/
            frontend/test-results/
            .product/logs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Tear down product test stack
        if: always()
        run: |
          make product-down || true
          docker compose -f infra/docker-compose.yml --env-file .env --profile product down --volumes || true

  engineering-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load exact pull-request revisions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REPOSITORY_URL: ${{ github.event.pull_request.head.repo.clone_url }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if [ "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY" ]; then
            git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          else
            case "$HEAD_REPOSITORY_URL" in
              https://github.com/*.git) ;;
              *) echo "Untrusted pull-request head repository URL" >&2; exit 1 ;;
            esac
            git fetch --no-tags --depth=1 "$HEAD_REPOSITORY_URL" "$HEAD_SHA"
          fi
      - name: Test Engineering authoring and policy contracts
        run: node --test scripts/tests/engineering-*.test.mjs
      - name: Validate exact Engineering pull-request evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/validate-engineering-impact.mjs "$GITHUB_EVENT_PATH"
      - name: Verify deterministic Chanter Engineering projections
        run: node scripts/build-engineering-journal.mjs --check
