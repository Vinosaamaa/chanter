name: Recovery drill
on:
  pull_request:
    paths:
      - 'infra/production/postgres/**'
      - 'scripts/deploy/recovery*'
      - 'scripts/deploy/restore-*'
      - 'scripts/deploy/configuration-backup*'
      - 'scripts/deploy/terminal-journal*'
      - 'infra/production/java/Lifecycle.java'
      - 'scripts/deploy/fixtures/Lifecycle*'
      - 'scripts/deploy/download-backup-tool.sh'
      - 'infra/production/tool-lock.json'
      - 'infra/production/runtime-lock.json'
      - 'infra/production/recovery-policy.json'
      - 'scripts/deploy/host*'
      - '.github/workflows/recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  encrypted-postgres-restore:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify fixed private lifecycle transport
        run: |
          mkdir -p .cache/lifecycle-helper
          javac -d .cache/lifecycle-helper infra/production/java/Lifecycle.java scripts/deploy/fixtures/LifecycleContractTest.java scripts/deploy/fixtures/LifecycleHttpFixture.java
          java -cp .cache/lifecycle-helper LifecycleContractTest
          java -cp .cache/lifecycle-helper LifecycleHttpFixture
      - name: Validate recovery configuration
        run: |
          node --test scripts/deploy/recovery.test.mjs scripts/deploy/recovery-runtime.test.mjs scripts/deploy/configuration-backup.test.mjs scripts/deploy/host.test.mjs scripts/deploy/restore-isolated.test.mjs
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { backupUnits } from './scripts/deploy/recovery.mjs';
          fs.mkdirSync('.cache/recovery-units', { recursive: true });
          for (const [name, value] of Object.entries(backupUnits('/srv/chanter/production', process.execPath))) {
            fs.writeFileSync(`.cache/recovery-units/${name}`, value);
          }
          JS
          systemd-analyze verify .cache/recovery-units/*.service .cache/recovery-units/*.timer
      - name: Build pinned backup-capable PostgreSQL
        run: |
          base=$(node -p 'JSON.parse(require("fs").readFileSync("infra/production/runtime-lock.json")).postgres')
          docker build --file infra/production/postgres/Dockerfile --build-arg "POSTGRES_IMAGE=$base" --tag chanter-recovery-drill .
      - name: Verify the configuration recovery tool
        run: |
          case "$(uname -m)" in x86_64) architecture=amd64 ;; aarch64) architecture=arm64 ;; *) exit 1 ;; esac
          bash scripts/deploy/download-backup-tool.sh "$architecture" "$GITHUB_WORKSPACE/.cache/recovery-tools"
      - name: Restore encrypted data and stop at a real WAL recovery point
        run: bash scripts/deploy/recovery-drill.sh chanter-recovery-drill "$GITHUB_WORKSPACE/.cache/recovery-tools/restic"
      - name: Verify encrypted deletion authority and fail-closed recovery sequencing
        env:
          CHANTER_TEST_RESTIC: ${{ github.workspace }}/.cache/recovery-tools/restic
        run: node --test scripts/deploy/terminal-journal*.test.mjs
